<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veslora</title>

  <link rel="icon" type="image/svg+xml" href="/assets/veslora-logo.svg">
  <link rel="apple-touch-icon" href="/assets/veslora-logo.svg">
  <meta name="theme-color" content="#000000">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Veslora",
      "url": "https://veslora.com",
      "logo": "https://veslora.com/assets/veslora-logo.svg"
    }
  </script>

  <meta name="description" content="Veslora - Minimal. Editorial. Intentional. A quiet luxury brand in progress.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,600&display=swap"
    rel="stylesheet">
</head>

<body>

  <div class="noise-overlay"></div>

  <div id="intro-layer">
    <div id="spotlight-text" class="spotlight-text"></div>
  </div>

  <div id="main-content" class="main-site">
    <div class="bg-wrapper" id="bgParallax"></div>

    <section class="hero">
      <div class="content">
        <h1 class="brand" aria-label="Veslora">
          <span id="type-text"></span><span class="cursor" id="cursor"></span>
        </h1>

        <div class="fade-wrapper" id="fadeContent">
          <p class="tagline">Minimal. Editorial. Intentional.<br>A quiet luxury brand in progress.</p>
          <div class="actions">
            <button class="btn btn-primary" onclick="openModal()">Contact Us</button>
            <button class="btn" onclick="copyEmail()">Copy Email</button>
          </div>
        </div>
      </div>

      <div class="footer">
        <span>&copy; 2026</span>
      </div>
    </section>
  </div>

  <div class="modal" id="emailModal">
    <div class="modal-box">
      <div class="email-display" id="emailText">info@veslora.com</div>
      <div class="modal-actions">
        <button class="btn btn-primary" onclick="openMail()">Open Mail</button>
        <button class="btn" onclick="copyEmail()">Copy</button>
        <button class="btn" onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="/main.ts"></script>
</body>

</html>
